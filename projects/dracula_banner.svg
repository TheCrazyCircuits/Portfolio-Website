<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%">
  <defs>
    <linearGradient id="oledBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="100%" stop-color="#180e22"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f0883e"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="300" fill="url(#oledBg)"/>

  <!-- OLED Frame Outer -->
  <g transform="translate(180, 45)">
    <!-- PCB Board -->
    <rect x="-30" y="-15" width="300" height="170" rx="10" fill="#121820" stroke="#232d3d" stroke-width="2"/>
    <!-- 4-Pin I2C Header -->
    <rect x="90" y="-15" width="60" height="10" fill="#1c2533" rx="2"/>
    <circle cx="100" cy="-10" r="2.5" fill="#f0883e"/>
    <circle cx="113" cy="-10" r="2.5" fill="#f0883e"/>
    <circle cx="127" cy="-10" r="2.5" fill="#f0883e"/>
    <circle cx="140" cy="-10" r="2.5" fill="#f0883e"/>
    <text x="120" y="-1" text-anchor="middle" fill="#8b949e" font-family="'Fira Code', monospace" font-size="8">GND VCC SCL SDA</text>

    <!-- Glass Display Inner -->
    <rect x="-10" y="8" width="260" height="135" rx="6" fill="#000" stroke="#388bfd" stroke-width="1.5"/>

    <!-- Displayed Graphic (Dracula / Bat silhouette) -->
    <!-- Bat -->
    <path d="M120 48 Q100 30 80 44 Q70 60 90 70 Q110 58 120 66 Q130 58 150 70 Q170 60 160 44 Q140 30 120 48 Z" fill="#58a6ff" filter="url(#neonGlow)"/>
    
    <!-- Audio Waveform on OLED -->
    <path d="M0 110 L25 110 L35 95 L45 125 L55 90 L65 130 L75 80 L85 140 L95 85 L105 135 L115 75 L125 145 L135 80 L145 135 L155 95 L165 125 L175 100 L185 120 L195 105 L205 115 L240 110" 
          stroke="#3fb950" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="300" y="248" text-anchor="middle" fill="#f0f6fc" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="22" letter-spacing="3">DRACULA ON OLED</text>
  <text x="300" y="272" text-anchor="middle" fill="#a371f7" font-family="'Fira Code', monospace" font-size="12">SSD1306 GRAPHICS & PWM AUDIO SYNC</text>
</svg>